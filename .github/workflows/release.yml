# Publish `ezpkg` with Trusted Publishing (OIDC); no API token exists.
#
# Started by hand, from the Actions tab or with
#     gh workflow run release.yml -f target=testpypi
# `testpypi` uploads a disposable `dev` version of whatever commit is
# chosen; `pypi` uploads `ezpkg.__version__`, and only from its `v` tag.
# Each target has a GitHub environment of the same name, whose required
# reviewer (Wayne) approves the upload; `pypi`'s admits only `v*` tags.
# After the upload, `check.yml` runs the Quick Start as a new user on
# every system against the version just published (`T.utpat`).  See
# `T.wrw` and `T.ffrp`.

name: release
# The title `release_check.py` looks for.
run-name: release ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        type: choice
        options:
          - testpypi
          - pypi

# Nothing but the publish job gets more than reading the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.built.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned to the versions used on Wayne's machine, so that a new
      # lint rule cannot fail a release.
      - run: python -m pip install ruff==0.17.0 mypy==1.9.0 twine
      - run: ruff check .
      - run: mypy .
      - run: python release.py "${{ inputs.target }}" dist
      - run: twine check --strict dist/*
      # The version is the wheel's, `ezpkg-VERSION-py3-none-any.whl`.
      - id: built
        run: |
          wheel="$(basename dist/ezpkg-*.whl)"
          version="${wheel#ezpkg-}"
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ inputs.target == 'testpypi'
                && 'https://test.pypi.org/legacy/'
                || 'https://upload.pypi.org/legacy/' }}

  # pypi.org's page of the newest `ezpkg`, which the bootstrap reads,
  # can name the previous release for a minute or more after an upload
  # (S5.1), so the check waits until it names this one.  test.pypi.org
  # needs no wait: `release_check.py` hands its wheel over itself.
  listed:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          if [ "$TARGET" != pypi ]; then exit 0; fi
          for attempt in $(seq 1 30); do
            newest="$(curl -fsSL https://pypi.org/pypi/ezpkg/json \
                      | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])' \
                      || true)"
            if [ "$newest" = "$VERSION" ]; then exit 0; fi
            echo "pypi.org names ezpkg ${newest:-nothing} as newest, not $VERSION; asking again in 10 s"
            sleep 10
          done
          echo "pypi.org never named ezpkg $VERSION as newest"
          exit 1
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ needs.build.outputs.version }}

  # The version just published, as a new user would get it.
  check:
    needs: [build, publish, listed]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      target: ${{ inputs.target }}
      version: ${{ needs.build.outputs.version }}
