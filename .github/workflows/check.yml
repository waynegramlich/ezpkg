# Run the Quick Start as a new user on Linux, Windows and macOS, for
# every supported Python, against a published `ezpkg`.
#
# Started by hand, from the Actions tab or with
#     gh workflow run check.yml -f target=testpypi -f version=VERSION
# With no `version`, `release_check.py` asks `gh` which version the
# newest successful `release TARGET` run built.  Uploads nothing, so it
# needs no environment and no approval.  See `T.gar`.

name: check
run-name: check ${{ inputs.target }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which index to check
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      version:
        description: The ezpkg version (default the newest release run's)
        required: false
        type: string

# Reading the repository, and the release runs for `gh run download`.
permissions:
  contents: read
  actions: read

jobs:
  quick-start:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest     # Apple Silicon.
          - macos-15-intel   # The last Intel image, until fall 2027.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The inputs pass through the environment, never into the script.
      # `TMPDIR` puts the scratch directory where a failure can keep it.
      - run: python release_check.py "$TARGET" $VERSION
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
      # `release_check.py` leaves its scratch directory when it fails;
      # `.ezpkg` is hidden, hence `include-hidden-files`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/release_check-*
          include-hidden-files: true

  # python.org's macOS Python reads no Keychain and has no certificates
  # until its `Install Certificates.command` is run, which many people
  # never do; the bootstrap then fetches with `curl` (`I.btosc`).
  python-org:
    strategy:
      fail-fast: false
      matrix:
        version: ["3.14.8", "3.15.0"]
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # `release_check.py` itself fetches with `urllib`, so it runs on
      # a Python with certificates, and hands the Quick Start the other.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install python.org's Python, without its certificates
        run: |
          curl -fsSLO "https://www.python.org/ftp/python/$VERSION/python-$VERSION-macos11.pkg"
          sudo installer -pkg "python-$VERSION-macos11.pkg" -target /
          # The runner image may have run `Install Certificates.command`
          # for an earlier install of the same minor version.
          sudo rm -f "/Library/Frameworks/Python.framework/Versions/${VERSION%.*}/etc/openssl/cert.pem"
      - name: Show where it looks for certificates
        run: |
          PY="/Library/Frameworks/Python.framework/Versions/${VERSION%.*}/bin/python3"
          "$PY" --version
          "$PY" -c "import ssl; print(ssl.get_default_verify_paths())"
          ls -l "$(dirname "$PY")/../etc/openssl/" || true
          env | grep '^SSL_' || echo "no SSL_ variables"
      - run: |
          unset SSL_CERT_FILE SSL_CERT_DIR
          python release_check.py \
            --python "/Library/Frameworks/Python.framework/Versions/${VERSION%.*}/bin/python3" \
            "$TARGET" $CHECKED
        env:
          TARGET: ${{ inputs.target }}
          CHECKED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

  # The download prompt on a real terminal: a pseudoterminal on Linux
  # and macOS, a Windows pseudoconsole through `pywinpty`, where
  # `ezpkg` must find `CONIN$` (`I.owenabd`).
  console:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty
      - run: python release_check.py --console "$TARGET" $VERSION
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
