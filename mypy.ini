# Configuration for `mypy`, the companion to `ruff.toml`.
#
# The interpreter here is 3.12, so by default `mypy` would happily accept
# something that only exists in 3.12 and the floor of 3.11 would be a
# claim nothing checked.  Naming the version makes `mypy` check against
# the 3.11 standard library instead.  See Step 6.7.7 in `LOGBOOK.md`.
[mypy]
python_version = 3.11
# The `ux/drive.py` snapshots, as in `ruff.toml`.
exclude = ux/ux[0-9]+_prog.*[.]py$
