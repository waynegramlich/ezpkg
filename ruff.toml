# Configuration for `ruff`, which this project had none of until the
# Python floor became a real constraint.
#
# Without a target version `ruff` assumes 3.10, and so does not believe
# `tomllib` is in the standard library: it sorted the import into the
# third party block, which would have been wrong and would have stayed
# wrong silently.  Step 6.7.7 in `LOGBOOK.md` set the floor at 3.11, and
# this is the linter being told the same thing.
#
# `alt_venv.py`'s own PEP 723 block is the authority: `FLOOR` in
# `alt_venv_test.py` is read out of it.  Configuration cannot be derived
# that way, so this file and `mypy.ini` still say 3.11 by hand, and
# `test_the_linters_agree_with_the_block` is what stops them drifting.
target-version = "py311"

[lint.per-file-ignores]
# Every case in `bootstrap.py` is text that a person pastes into their
# own program, so it carries its own `try`, and that `try` catches
# `Exception` on purpose: a missing network must read as one line of
# diagnosis rather than a traceback, while a control-C still reads as
# a control-C.  A `noqa` comment would be pasted along with it, into
# code whose readers never run `ruff`, so the exception lives here.
#
# Each case also ends `module = importlib.import_module(...)`, binding a
# name for the program it is pasted into.  Here every case is a function
# of its own, so the name looks unused (`F841`) though it is not, once
# pasted; the harness reads the module back from `sys.modules` instead.
#
# And a bootstrap is meant to be small enough to feel like magic, so the
# shipping case is squeezed on purpose, with short statements on one
# topic sharing a line (`E702`).  Its imports stay one to a line and in
# order, because the person moves them to the top of their program and
# many tools there check exactly that.
"bootstrap.py" = ["BLE001", "F841", "E702"]

# `quick_start.py` is the whole program `README.md` asks a person to
# copy, so it carries the shipping bootstrap's `try` and catches
# `Exception` for the reason given above.  A `noqa` would be copied too.
"quick_start.py" = ["BLE001"]
